services:
  - type: web
    name: xeng
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn application.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: XENG_ADMIN_PASSWORD
        sync: false
      - key: XENG_SESSION_SECRET
        generateValue: true
      - key: XENG_SECURE_COOKIES
        value: "true"
      - key: CROSSREF_MAILTO
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: XENG_PUBLIC_URL
        value: "https://xeng.onrender.com"
